# Juice League draft board configuration.
# Everything here that also exists on the Sheet's Config tab is only the
# *initial* value written by the build; during the draft, edit the Sheet.

league:
  name: Juice League
  num_teams: 14            # 12, 13 or 14 -- switchable live on the Config tab
  team_count_options: [12, 13, 14]
  rounds: 14               # G,G,G,F,F,F,C,Util,Util,Util + 4 BN
  my_slot: 1               # fill in once Yahoo shows the draft order
  starting_slots: {G: 3, F: 3, C: 1}
  playoff_weeks: [18, 19, 20]   # Yahoo week numbers; editable live on Config
  categories: [FG%, FT%, 3PTM, PTS, REB, AST, STL, BLK, A/T]

valuation:
  full_season_games: 75          # availability: min(1, games/75) ^ exponent
  availability_exponent: 0.5
  iterations: 2                  # rank -> re-pick pool -> recompute
  # Replacement level: for each of G/F/C, average the first N players eligible at that
  # position ranked from (pool size + offset) down. Offset -16 = from ~#180 at 14 teams
  # (#152 at 12, #166 at 13): deliberately a bit above true waiver level, since the room
  # won't draft by these rankings.
  replacement_start_offset: -16
  replacement_per_position: 5
  replacement_mode: blended      # blended: one line = mean of the G/F/C lines
                                 # positional: each player vs. his own position's line
  missing_adp: 250

noise:                           # Punt Advisor win probabilities (see valuation.category_noise)
  weighted: true                 # Value weights categories by 1/noise (Config NoiseWeighted, live)
  weekly_games_per_player: 2.8   # counted games per roster spot per week (10 active slots)
  team_spread_factor: 0.7        # opponent-roster spread vs. random 14-player teams
  phi:                           # fallback model only (used when `measured` is absent);
    pts: 3.09                    # fitted from 2025-26 game logs by scripts/fit_noise.py
    reb: 1.32
    ast: 1.26
    stl: 1.07
    blk: 1.11
    fg3m: 1.18
    tov: 1.02
    fg_pct: 0.91
    ft_pct: 1.06
  measured:                     # scripts/measure_week_noise.py (2025-26 game logs)
    games_per_spot: 2.86
    weekly_sd:
      fg_pct: 9.674
      ft_pct: 4.395
      fg3m: 11.042
      pts: 72.624
      reb: 26.073
      ast: 19.619
      stl: 7.208
      blk: 5.411
      a_to: 19.172

opponents:
  adp_weight: 0.5                # opp_rank = w * ADP + (1 - w) * Yahoo rank
  sigma_mult: 0.18
  sigma_min: 2
  drift_window: 20               # last N logged picks
  drift_min_picks: 5             # Drift = 0 until this many picks are logged

matching:
  report_below: 95               # print every fuzzy match under this similarity
  min_accept: 80                 # below this a name is treated as unmatched
  overrides_file: data/name_overrides.csv

paths:
  projections: data/raw/projections.csv
  projections_secondary: null    # optional second projection source to average in
  adp: data/raw/adp.csv             # Yahoo L7ADP (scripts/import_yahoo.py)
  yahoo_rank: data/raw/yahoo_rank.csv
  schedule: data/raw/schedule.csv   # team x Yahoo-week games grid (Hashtag schedule grid)
  players: data/players.csv
  values: data/values.csv
  xlsx: out/juice_draft_board.xlsx

board:
  main_rows: 40
  sanity_rows: 10
  can_wait_pavail: 0.7
  sleeper_gap: 15                # ★ when value rank beats ADP rank by this much
  need_weight: 3                 # Score bonus for filling a G/F/C need (scaled by urgency)
  max_players: 400               # rows written to the Players tab

gsheets:
  service_account_json: secrets/service_account.json
  spreadsheet_id: 1k2fz_fpu7vvQJ1y-VeWSowAnOW03H6AEgxxvxw3BgCA
  spreadsheet_title: Juice League Draft Board

yahoo:
  league_id: 75810               # scripts/yahoo_sync.py (live pick logging)
